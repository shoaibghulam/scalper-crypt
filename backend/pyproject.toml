[project]
name = "scalper-crypt"
version = "0.1.0"
description = "Self-hosted crypto scalping bot platform for Binance USDT-M Futures"
requires-python = ">=3.12"
dependencies = [
    "python-binance==1.0.37",
    "websockets<16",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "cryptography>=43",
    "httpx>=0.27",
    "orjson>=3.10",
    "tzdata==2026.4",
]

[project.optional-dependencies]
alpha = ["torch==2.7.1", "numpy>=2.2,<3"]
research = ["numpy>=2.2,<2.6", "numba==0.67.0", "scikit-learn==1.9.1", "optuna==5.0.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "freezegun>=1.5",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scalper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests read better with the value under test on the left, and nested with
# blocks are how we assert that a second acquisition is refused.
# RUF005 wants unpacking over concatenation. In these fixtures the list
# plus a trailing bar reads as "the history, then the bar under test",
# which is the point.
"tests/**" = ["SIM300", "SIM117", "RUF005"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
warn_return_any = true

[tool.coverage.run]
branch = true
omit = [
    "*/api/__main__.py",
]

[tool.coverage.report]
fail_under = 80
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
